server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # All browser and Clerk proxy calls remain on the same public HTTPS
    # origin; only Docker's private network can reach the API and MongoDB.
    location /api/ {
        client_max_body_size 12m;
        proxy_pass http://navdeck-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://navdeck-backend:8000/health;
        proxy_set_header Host $http_host;
    }
    location = /health/ready {
        proxy_pass http://navdeck-backend:8000/health/ready;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
