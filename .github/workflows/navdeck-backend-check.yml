name: NAVDECK backend readiness checks

on:
  push:
    branches: [main, 'fix/**', 'feature/**']
    paths:
      - 'backend/**'
      - '.github/workflows/navdeck-backend-check.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/navdeck-backend-check.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend and HTTP test client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt httpx==0.27.2
      - name: Verify backend syntax
        run: python -m compileall -q backend
      - name: Test login readiness and CORS without Atlas
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: navdeck
        run: python backend/check_login_readiness.py
