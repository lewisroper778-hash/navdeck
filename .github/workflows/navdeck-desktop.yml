name: NAVDECK Desktop Windows Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'backend/**'
      - '.github/workflows/navdeck-desktop.yml'
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'backend/**'
      - '.github/workflows/navdeck-desktop.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout NAVDECK
        uses: actions/checkout@v4

      - name: Check NAVDECK backend Python syntax
        shell: pwsh
        run: |
          python -m py_compile backend/bridge.py backend/server.py

      - name: Test strict waypoint and fuel reporting rules
        shell: pwsh
        run: python -m unittest backend.tests.test_desktop_reporting_validation -v

      - name: Verify locally bundled dashboard JavaScript syntax
        shell: pwsh
        run: |
          @'
          import pathlib
          import re
          import subprocess
          import tempfile
          pages = ("map.html", "workspace.html", "flight.html")
          for name in pages:
              html = (pathlib.Path("desktop/ui") / name).read_text(encoding="utf-8")
              parts = re.findall(r"<script(?:\\s+[^>]*)?>(.*?)</script>", html, re.S | re.I)
              if not parts:
                  raise RuntimeError(f"No inline JS in {name}")
              for index, script in enumerate(parts):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile(mode="w", suffix=".js", encoding="utf-8", delete=False) as tmp:
                      tmp.write(script)
                      js_path = tmp.name
                  try:
                      subprocess.run(["node", "--check", js_path], check=True)
                  finally:
                      pathlib.Path(js_path).unlink(missing_ok=True)
              print("Validated:", name)
          '@ | python -

      - name: Smoke-test local flight phases including Close & Sign
        shell: pwsh
        run: node desktop/tests/flight-ui-smoke.cjs

      - name: Smoke-test SimBrief import routing and account sign-out
        shell: pwsh
        run: node desktop/tests/workspace-account-smoke.cjs

      - name: Smoke-test touchdown plotter and Clerk handoff wiring
        shell: pwsh
        run: node desktop/tests/touchdown-ui-smoke.cjs

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test automatic go-around detector
        run: dotnet run --project desktop/GoAroundDetector.Tests/GoAroundDetector.Tests.csproj --configuration Release

      - name: Bundle pinned Leaflet map assets for instant local loading
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'desktop/ui/vendor' | Out-Null
          $assets = @(
            @{ name = 'leaflet.js'; sri = '20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=' },
            @{ name = 'leaflet.css'; sri = 'p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=' }
          )
          foreach ($asset in $assets) {
            $file = "desktop/ui/vendor/$($asset.name)"
            curl.exe --fail --location --silent --show-error --output $file "https://unpkg.com/leaflet@1.9.4/dist/$($asset.name)"
            if ($LASTEXITCODE -ne 0) { throw "Leaflet download failed: $($asset.name)" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash
            $actual = [Convert]::ToBase64String([Convert]::FromHexString($hash))
            Write-Host "Verified source $($asset.name): $actual"
            if ($actual -ne $asset.sri) { throw "Leaflet integrity mismatch: $($asset.name)" }
          }

      - name: Restore dependencies
        run: dotnet restore desktop/NavdeckDesktop/NavdeckDesktop.csproj -r win-x64

      - name: Build Windows application
        run: >
          dotnet publish desktop/NavdeckDesktop/NavdeckDesktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output desktop-output


      - name: Verify the actual website logo is packaged
        shell: pwsh
        run: |
          $original = 'frontend/public/favicon.png'
          $packaged = 'desktop-output/desktop-map/navdeck-website-logo.png'
          if (!(Test-Path $packaged)) { throw 'Website logo missing from Windows build' }
          if ((Get-FileHash $original -Algorithm SHA256).Hash -ne
              (Get-FileHash $packaged -Algorithm SHA256).Hash) {
            throw 'Desktop logo differs from NAVDECK website logo'
          }

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress

      - name: Package Windows installer
        shell: powershell
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc desktop/NavdeckDesktop/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NAVDECK-Desktop-Redesign-Installer-x64
          path: installer-output/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: NAVDECK-Desktop-Windows-x64
          path: desktop-output/
          if-no-files-found: error
          retention-days: 7
      - name: Publish Windows installer to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "desktop-" + "${{ github.run_number }}"
          gh release create $tag installer-output/*.exe --target $env:GITHUB_SHA --title "NAVDECK Desktop $tag" --latest --notes "Public NAVDECK Desktop installer for Windows x64. NAVDECK 1.3.0 adds the Touchdown Plotter sidebar page, in-app Clerk account sign-in without manual pairing codes, a Windows watcher that opens NAVDECK when MSFS starts, and direct SimConnect telemetry when its runtime is available (FSUIPC7 fallback). Includes SimBrief reporting, go-around review, and secure desktop sign-out. Requires a working NAVDECK backend and an MSFS-compatible SimConnect runtime or FSUIPC7 for live telemetry. The installer is not code-signed; test live telemetry and cloud pairing on your PC."
