name: NAVDECK Desktop Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/desktop-live-map'
    paths:
      - 'desktop/**'
      - '.github/workflows/navdeck-desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/navdeck-desktop.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout NAVDECK
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore desktop/NavdeckDesktop/NavdeckDesktop.csproj -r win-x64

      - name: Build Windows application
        run: >
          dotnet publish desktop/NavdeckDesktop/NavdeckDesktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output desktop-output

      - name: Verify packaged live map
        shell: pwsh
        run: |
          $map = "desktop-output/desktop-map/map.html"
          if (-not (Test-Path $map)) {
            throw "Desktop live map was not included in the published application."
          }
          $html = Get-Content $map -Raw
          if ($html -notmatch 'navdeckDesktop.getTelemetry') {
            throw "Packaged live map is missing native telemetry integration."
          }
          if (-not (Test-Path "desktop-output/NavdeckDesktop.exe")) {
            throw "Published Windows executable was not found."
          }
          Write-Host "Desktop executable and live map are present."

      - name: Syntax-check packaged map JavaScript
        shell: pwsh
        run: |
          $html = Get-Content "desktop-output/desktop-map/map.html" -Raw
          $inlineScripts = [regex]::Matches($html, '(?s)<script(?:\\s[^>]*)?>(.*?)</script>')
          $count = 0
          foreach ($match in $inlineScripts) {
            $source = $match.Groups[1].Value
            if ([string]::IsNullOrWhiteSpace($source)) { continue }
            $temp = Join-Path $env:RUNNER_TEMP "navdeck-map-check-$count.js"
            [System.IO.File]::WriteAllText($temp, $source)
            & node --check $temp
            if ($LASTEXITCODE -ne 0) {
              throw "Invalid JavaScript in packaged map script $count"
            }
            $count++
          }
          if ($count -lt 1) { throw "No inline map JavaScript found to validate." }
          Write-Host "Validated $count inline map script(s)."

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Bundle Microsoft WebView2 bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "desktop-deps" | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "desktop-deps/MicrosoftEdgeWebview2Setup.exe"
          if ((Get-Item "desktop-deps/MicrosoftEdgeWebview2Setup.exe").Length -lt 100000) {
            throw "Microsoft WebView2 runtime bootstrapper download was incomplete."
          }

      - name: Build Windows setup installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found." }
          & $compiler "desktop/installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed." }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NAVDECK-Desktop-Setup-x64
          path: desktop-installer/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: NAVDECK-Desktop-Windows-x64
          path: desktop-output/
          if-no-files-found: error
          retention-days: 7
