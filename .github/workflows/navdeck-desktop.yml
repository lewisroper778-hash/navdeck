name: NAVDECK Desktop Windows Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'backend/**'
      - '.github/workflows/navdeck-desktop.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout NAVDECK
        uses: actions/checkout@v4

      - name: Check NAVDECK backend Python syntax
        shell: pwsh
        run: |
          python -m py_compile backend/bridge.py backend/server.py

      - name: Test strict waypoint and fuel reporting rules
        shell: pwsh
        run: python -m unittest backend.tests.test_desktop_reporting_validation -v

      - name: Verify locally bundled dashboard JavaScript syntax
        shell: pwsh
        run: |
          @'
          import pathlib
          import re
          import subprocess
          import tempfile
          pages = ("map.html", "workspace.html", "flight.html")
          for name in pages:
              html = (pathlib.Path("desktop/ui") / name).read_text(encoding="utf-8")
              parts = re.findall(r"<script(?:\\s+[^>]*)?>(.*?)</script>", html, re.S | re.I)
              if not parts:
                  raise RuntimeError(f"No inline JS in {name}")
              for index, script in enumerate(parts):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile(mode="w", suffix=".js", encoding="utf-8", delete=False) as tmp:
                      tmp.write(script)
                      js_path = tmp.name
                  try:
                      subprocess.run(["node", "--check", js_path], check=True)
                  finally:
                      pathlib.Path(js_path).unlink(missing_ok=True)
              print("Validated:", name)
          '@ | python -

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore desktop/NavdeckDesktop/NavdeckDesktop.csproj -r win-x64

      - name: Build Windows application
        run: >
          dotnet publish desktop/NavdeckDesktop/NavdeckDesktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output desktop-output


      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress

      - name: Package Windows installer
        shell: powershell
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc desktop/NavdeckDesktop/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NAVDECK-Desktop-Redesign-Installer-x64
          path: installer-output/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: NAVDECK-Desktop-Windows-x64
          path: desktop-output/
          if-no-files-found: error
          retention-days: 7
