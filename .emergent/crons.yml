crons:
  - name: friend-landings
    description: "Checks VATSIM every 15 minutes so friends' landings are caught while pilots are away"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/friend-landings"
    method: POST
    enabled: true
