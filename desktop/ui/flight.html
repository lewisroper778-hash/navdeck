</style></head><body><main><header class="top"><div class="crumb">NAVDECK › MY FLIGHTS › <b>FLIGHT OPERATIONS</b></div><span class="status ok"><i></i><span>Desktop cloud link</span></span></header><div class="toolbar"><button class="button ghost" id="back">← My Flights</button></div><section class="hero"><div><span class="eyebrow">OPERATIONAL FLIGHT DECK</span><h1 id="title">Loading flight…</h1><p id="route">— → —</p><p id="aircraft"></p></div></section><div id="statusMsg" hidden></div><div class="panel" id="summary"></div><nav class="phasebar" id="phasebar"></nav><div id="stage"></div></main><script>
(()=>{
'use strict';
const d=id=>document.getElementById(id);
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const v=id=>d(id)?.value.trim()||'';
const api=(name,arg)=>window.navdeckDesktop?.[name]?.(arg)||Promise.reject(Error('Native bridge unavailable'));
const info=(k,x)=>'<div class="detail"><small>'+e(k)+'</small><b>'+e(x??'—')+'</b></div>';
const details=(items)=>'<div class="details-grid">'+items.map(([k,x])=>info(k,x)).join('')+'</div>';
const panel=(title,body)=>'<section class="panel"><div class="panel-head"><h2>'+e(title)+'</h2></div>'+body+'</section>';
const field=(id,label,value,ph='',type='text')=>'<div class="field"><label for="'+id+'">'+e(label)+'</label><input id="'+id+'" type="'+type+'" value="'+e(value??'')+'" placeholder="'+e(ph)+'"></div>';
const button=(id,title)=>'<button class="button primary" id="'+id+'" data-edit>'+e(title)+'</button>';
const time=/^([01]\d|2[0-3]):[0-5]\d$/;
const phases=['briefing','departure','enroute','arrival','close'];

function clockAdd(base,seconds){
 if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(base||''))return null;
 const [h,m]=base.split(':').map(Number);
 const total=((h*60+m+Math.round(Number(seconds||0)/60))%1440+1440)%1440;
 return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}
function timeDeviation(actual,planned){
 if(!actual||!planned)return null;
 let [a,b]=[actual,planned].map(v=>{const [h,m]=v.split(':').map(Number);return h*60+m});
 let delta=a-b;
 if(delta>720)delta-=1440;
 if(delta< -720)delta+=1440;
 return delta;
}
function navlogRows(flight){
 const base=flight.times?.takeoff||flight.times?.sched_takeoff||null;
 let lastATA=null,lastETASecs=0,lastFuelDeviation=0;
 return (flight.waypoints||[]).map(w=>{
   if(w.skipped)return {...w,eto:null,planned:null,fuelDeviation:null,timeDev:null};
   const sec=Number(w.eta||0);
   const planned=base&&w.eta?clockAdd(base,sec):null;
   const planFuel=(w.fob!==null&&w.fob!==undefined&&w.fob!=='')?Number(w.fob):null;
   const actualFuel=(w.actual_fob!==null&&w.actual_fob!==undefined&&w.actual_fob!=='')?Number(w.actual_fob):null;
   const fuelDeviation=Number.isFinite(actualFuel)&&Number.isFinite(planFuel)?actualFuel-planFuel:null;
   let eto,dev;
   if(w.ata){
     eto=w.ata;dev=timeDeviation(w.ata,planned);
     lastATA=w.ata;lastETASecs=sec;
   }else{
     eto=lastATA?clockAdd(lastATA,sec-lastETASecs):planned;
     dev=lastATA&&planned?timeDeviation(eto,planned):null;
   }
   const estimatedFuel=Number.isFinite(actualFuel)?actualFuel:
     Number.isFinite(planFuel)?planFuel+lastFuelDeviation:null;
   if(fuelDeviation!==null)lastFuelDeviation=fuelDeviation;
   return {...w,planned,eto,timeDev:dev,fuelDeviation,estimatedFuel};
 });
}
function fuelSummary(flight,rows){
 const current=rows.filter(x=>!x.skipped&&x.fuelDeviation!==null);
 const deviation=current.length?current[current.length-1].fuelDeviation:0;
 const fuel=flight.fuel||{};
 const dest=rows.filter(x=>!x.skipped).at(-1);
 const predicted=dest?.fob&&Number.isFinite(Number(dest.fob))?Number(dest.fob)+deviation:null;
 const minFuel=Number(fuel.min_fuel||0)||Number(fuel.alternate||0)+Number(fuel.reserve||0);
 const reserve=Number(fuel.mayday_fuel||fuel.reserve||0);
 const state=predicted===null?'NO FORECAST':predicted<reserve?'MAYDAY FUEL':predicted<minFuel?'MINIMUM FUEL':'NORMAL';
 return {deviation,predicted,state};
}
function signed(v,suffix=''){return v===null||!Number.isFinite(v)?'—':(v>0?'+':'')+Math.round(v)+suffix}

let id=new URL(location.href).searchParams.get('id'),f=null,section='briefing',pending=false,ink=false;
function message(text,error=false){let x=d('statusMsg');x.hidden=false;x.className='message '+(error?'err':'good');x.textContent=text}
function clear(){d('statusMsg').hidden=true}
function on(id,fn){if(d(id))d(id).onclick=fn}
function validateTimes(obj){for(const [k,x]of Object.entries(obj)){if(x&&!time.test(x))throw Error(k+' must be HH:MM UTC')}return obj}
function positive(x,name){if(x&&!/^\d+(\.\d+)?$/.test(x))throw Error(name+' must be a positive number');return x||''}
function act(action,values={}){
 if(pending)return Promise.resolve();pending=true;clear();
 return api('flightAction',{flight_id:f.id,operation:action,values}).then(data=>{
   if(!data?.flight)throw Error('No updated flight returned');
   f=data.flight;draw();message('Saved to NAVDECK');
 }).catch(err=>message(err.message,true)).finally(()=>{pending=false});
}
function run(fn){return ()=>{try{const out=fn();if(out&&typeof out.catch==='function')out.catch(x=>message(x.message,true))}catch(x){message(x.message,true)}}}
function init(){if(!id){message('No flight selected',true);return}
 api('getFlightDetails',{flight_id:id}).then(x=>{if(!x?.flight)throw Error('Flight not found');f=x.flight;draw()})
 .catch(x=>message('Cloud flight unavailable: '+x.message+'. The updated NAVDECK server API must be deployed.',true))}
function draw(){
 const closed=f.status==='closed';
 d('title').textContent=f.callsign||'Flight';
 d('route').textContent=(f.origin||'—')+' → '+(f.destination||'—');
 d('aircraft').textContent=(f.aircraft||'Unknown aircraft')+' · '+(closed?'Closed flight':'Active flight');
 const wp=f.waypoints||[], active=wp.filter(x=>!x.skipped),done=active.filter(x=>x.passed||x.ata).length;
 const next=active.find(x=>!x.passed&&!x.ata);
 d('summary').innerHTML=details([['Flight status',closed?'CLOSED':'OPEN'],['Progress',done+'/'+active.length+' fixes'],['Next waypoint',next?.ident],['Landing rate',f.landing_rate?'-'+Math.abs(Number(f.landing_rate))+' FPM':'—'],['Block fuel',f.fuel?.block],['OFP units',f.weights?.ofp_units||'KG']]);
 d('phasebar').innerHTML=phases.map((x,i)=>'<button class="phase '+(section===x?'active':'')+'" data-phase="'+x+'">'+(i+1)+' · '+({briefing:'Briefing',departure:'Departure',enroute:'Enroute',arrival:'Arrival',close:'Close & Sign'})[x]+'</button>').join('');
 document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{section=b.dataset.phase;draw()});
 d('stage').innerHTML=({briefing,departure,enroute,arrival,closeFlight})[section]();
 bind();
 if(closed){document.querySelectorAll('[data-edit]').forEach(b=>b.disabled=true);document.querySelectorAll('#stage input, #stage textarea, #stage select').forEach(b=>b.disabled=true);}
}
function briefing(){
 const t=f.times||{},fuel=f.fuel||{},w=f.weights||{};
 const notams=Object.entries(f.notams||{}).flatMap(([cat,items])=>(Array.isArray(items)?items:[]).map(x=>({cat,...x})));
 return '<div class="pair">'+panel('Operational flight plan',
 '<div class="report-list">'+e(f.route||'No route imported')+'</div><div class="rule"></div>'+
 details([['Departure',f.origin],['Destination',f.destination],['Alternate',f.alternate],['Cruise level',f.cruise_level],['Distance NM',f.distance],['ETE',f.ete]])+
 '<div class="rule"></div><h3 class="section-kicker">Scheduled UTC</h3>'+
 details([['OFF',t.sched_off],['T-O',t.sched_takeoff],['LDG',t.sched_landing],['ON',t.sched_on]])+
 '<div class="rule"></div><div class="fieldrow">'+field('tsat','TSAT UTC',t.tsat,'HH:MM')+field('ctot','CTOT UTC',t.ctot,'HH:MM')+'</div>'+button('saveSlots','Save slot times'))+
 panel('Fuel & loadsheet','<span class="tag">OFP: '+e(w.ofp_units||'KG')+'</span><h3 class="section-kicker">Fuel plan</h3>'+
 details(Object.entries(fuel).filter(([k])=>['taxi','trip','contingency','alternate','reserve','extra','block','min_takeoff','min_fuel','mayday_fuel'].includes(k)).map(([k,v])=>[k.replaceAll('_',' ').toUpperCase(),v]))+
 '<h3 class="section-kicker">Weights</h3>'+
 details([['OEW',w.oew],['ZFW',w.zfw],['TOW',w.tow],['LAW',w.law],['Max TOW',w.max_tow],['Max LAW',w.max_law]])+
 '<div class="rule"></div><div class="fieldrow">'+field('pax','Passenger count',w.pax_count,'0')+field('cargo','Cargo ('+(w.ofp_units||'KG')+')',w.cargo,'0')+'</div>'+
 '<div class="field" style="max-width:150px"><label>Display units</label><select id="units"><option value="KG" '+(w.units==='KG'?'selected':'')+'>KG</option><option value="LB" '+(w.units==='LB'?'selected':'')+'>LB</option></select></div>'+button('saveLoad','Save loadsheet'))+'</div>'+
 panel('Flight NOTAMs',notams.length?notams.slice(0,100).map(n=>'<details><summary>'+e(n.id||'NOTAM')+' · '+e(n.cat)+' · '+e(n.category||'Notice')+'</summary><p>'+e(n.text||n.raw||'No text')+'</p></details>').join(''):'<p class="muted">No NOTAMs imported with the flight plan.</p>');
}
function departure(){
 const t=f.times||{};
 return panel('Departure operations','<p class="muted">Manual UTC event entries are synchronised with the existing MSFS simulator bridge.</p><div class="fieldrow">'+
 field('off','OFF · Gate departure',t.off,'HH:MM')+field('to','T-O · Takeoff',t.takeoff,'HH:MM')+
 field('tsat2','TSAT · Start-up',t.tsat,'HH:MM')+field('ctot2','CTOT · Takeoff slot',t.ctot,'HH:MM')+
 '</div>'+button('saveDeparture','Save departure events'))+
 panel('Planned departure',details([['Scheduled OFF',t.sched_off],['Scheduled T-O',t.sched_takeoff],['Taxi fuel',f.fuel?.taxi],['Airport',f.origin]]));
}
function enroute(){
 const rows=navlogRows(f),active=rows.filter(x=>!x.skipped),next=active.find(x=>!x.passed&&!x.ata);
 const completed=active.filter(x=>x.passed||x.ata).length;
 const fuel=fuelSummary(f,rows),units=f.weights?.ofp_units||'KG';
 const tbody=rows.map((r,i)=>{
 const done=r.passed||r.ata;
 return '<tr class="'+(r.skipped?'skip':done?'done':next===r?'nextfix':'')+'"><td><input type="checkbox" data-pass="'+i+'" '+(done?'checked':'')+(r.skipped||f.status==='closed'?' disabled':'')+'></td>'+
 '<td><b>'+e(r.ident)+'</b><small style="display:block;color:#999">'+e(r.airway||'DCT')+'</small></td>'+
 '<td>'+e(r.altitude||'—')+'</td><td>'+e(r.eto||'—')+'</td><td>'+e(r.fob||'—')+'</td>'+
 '<td><input data-ata="'+i+'" value="'+e(r.ata||'')+'" placeholder="HH:MM"></td>'+
 '<td><input data-fob="'+i+'" value="'+e(r.actual_fob||'')+'" placeholder="FOB"></td>'+
 '<td><input data-alt="'+i+'" value="'+e(r.actual_alt||'')+'" placeholder="FT"></td>'+
 '<td>'+e(signed(r.timeDev,' min'))+'</td><td>'+e(signed(r.fuelDeviation))+'</td>'+
 '<td class="ops"><button data-wsave="'+i+'" data-edit>Save</button>'+
 (r.skipped?'<button data-restore="'+i+'" data-edit>Restore</button>':
 '<button data-skip="'+i+'" data-edit>Skip</button><button data-direct="'+i+'" data-edit>DCT</button>')+'</td></tr>';
 }).join('');
 const undos=[...new Set(rows.map(x=>x.direct_group).filter(Boolean))];
 const forecast=details([['Waypoint progress',completed+'/'+active.length],['Next fix',next?.ident||'—'],['Estimated landing fuel',fuel.predicted===null?'—':Math.round(fuel.predicted)+' '+units],['Fuel deviation',signed(fuel.deviation)+' '+units],['Fuel state',fuel.state],['ETOs',f.times?.takeoff?'Actual takeoff':'Scheduled']]);
 return panel('Enroute navigation','<p class="muted">Track waypoints, actual times, fuel and altitude, skip fixes or fly direct-to. Changes sync to your existing NAVDECK flight.</p>'+forecast+
 '<div class="rule"></div><div class="scroll-table"><table class="tab-table"><thead><tr><th>Passed</th><th>Fix</th><th>FL</th><th>ETO UTC</th><th>Plan FOB</th><th>ATA UTC</th><th>Actual FOB</th><th>ALT</th><th>ΔTime</th><th>ΔFuel</th><th>Actions</th></tr></thead><tbody>'+tbody+'</tbody></table></div>'+
 '<div class="mini-actions">'+undos.map((g,i)=>'<button class="button ghost" data-undo="'+e(g)+'" data-edit>Undo direct '+(i+1)+'</button>').join('')+
 '<button class="button ghost" id="reset" data-edit>Reset tracker</button></div><p class="muted">ETOs and fuel forecasts use the imported OFP and actual entries. Review any ATC direct routing changes before using estimates.</p>');
}
function arrival(){
 const t=f.times||{},n=f.arrival_notes||{};
 return '<div class="pair">'+panel('Arrival actuals','<div class="fieldrow">'+field('ldg','LDG · Touchdown',t.landing,'HH:MM')+field('on','ON · At gate',t.on,'HH:MM')+
 field('rate','Landing rate FPM',f.landing_rate,'e.g. 180')+field('fob','Fuel at gate ('+(f.weights?.ofp_units||'KG')+')',f.arrival_fob,'0')+
 '</div>'+button('saveArrival','Save arrival actuals'))+
 panel('Weather and arrival notes','<button class="button ghost" id="metarFetch" style="margin-bottom:13px">Fetch '+e(f.destination||'arrival')+' METAR</button>'+
 '<div class="field"><label>METAR / ATIS</label><textarea id="metar" rows="3">'+e(n.metar||'')+'</textarea></div>'+
 field('runway','Runway / taxi exit',n.runway,'25R / B5')+
 '<div class="field"><label>Flight remarks</label><textarea id="notes" rows="4">'+e(n.notes||'')+'</textarea></div>'+
 button('saveNotes','Save arrival notes'))+'</div>'+
 panel('Arrival summary',details([['Scheduled LDG',t.sched_landing],['Actual LDG',t.landing],['Scheduled ON',t.sched_on],['Actual ON',t.on],['Landing rate',f.landing_rate],['Arrival fuel',f.arrival_fob]]));
}
function closeFlight(){
 const t=f.times||{},sg=f.signoff||{},closed=f.status==='closed';
 const checks=[['Gate-out time',!!t.off],['Takeoff time',!!t.takeoff],['Landing time',!!t.landing],['Gate-in time',!!t.on],['Landing rate',!!f.landing_rate],['Commander sign-off',!!sg.signed]];
 const good=checks.every(x=>x[1]);
 const signature=sg.signed?
 '<div class="message good">Signed by '+e(sg.signed_by||'')+' · '+e(sg.signed_at?.slice(0,16)||'')+' UTC</div><p>'+e(sg.remarks||'No remarks')+'</p>'+
 (sg.signature?'<img src="'+e(sg.signature)+'" alt="Commander signature" style="background:white;max-height:110px;max-width:100%">':''):
 field('pilotName','Commander name','','Name')+
 '<div class="field"><label>Remarks</label><textarea id="remarks" rows="3"></textarea></div>'+
 '<div class="field"><label>Draw signature</label><canvas id="pad" class="signpad" width="640" height="130"></canvas></div>'+
 '<div class="row"><button class="button ghost" id="clearPad">Clear</button></div>'+
 '<label class="muted" style="display:block;margin:12px 0"><input type="checkbox" id="agree"> I confirm this flight record is accurate.</label>'+
 button('sign','Sign flight report');
 return '<div class="pair">'+panel('Completion checklist',checks.map(([name,ok])=>'<div class="checkline"><strong>'+e(name)+'</strong><b class="'+(ok?'green':'red')+'">'+(ok?'✓ Complete':'Required')+'</b></div>').join('')+
 '<div class="mini-actions">'+(closed?'<button class="button primary" id="reopen">Reopen flight</button>':'<button class="button primary" id="finish" '+(!good?'disabled':'')+'>Close flight</button>')+'</div>')+
 panel('Signed operational report',signature)+'</div>'+
 panel('Archive and export','<p class="muted">Closed flights are saved to NAVDECK Logbook. A signed PDF report can be saved directly to your PC.</p><div class="mini-actions"><button class="button ghost" id="print">Print flight summary</button>'+
 (closed?'<button class="button primary" id="pdf">Download signed PDF</button>':'')+'</div>');
}
function bind(){
 if(section==='briefing'){
  on('saveSlots',run(()=>act('saveTimes',validateTimes({tsat:v('tsat'),ctot:v('ctot')}))));
  on('saveLoad',run(()=>act('saveActuals',{pax_count:positive(v('pax'),'Passenger count'),cargo:positive(v('cargo'),'Cargo'),units:v('units')})));
 }
 if(section==='departure')on('saveDeparture',run(()=>act('saveTimes',validateTimes({off:v('off'),takeoff:v('to'),tsat:v('tsat2'),ctot:v('ctot2')}))));
 if(section==='enroute'){
  const row=i=>f.waypoints[i];
  document.querySelectorAll('[data-pass]').forEach(b=>b.onchange=()=>act('toggleWaypoint',{index:Number(b.dataset.pass),ident:row(Number(b.dataset.pass)).ident,passed:b.checked}));
  document.querySelectorAll('[data-wsave]').forEach(b=>b.onclick=run(()=>{
    const i=Number(b.dataset.wsave),r=row(i);
    const ata=document.querySelector('[data-ata="'+i+'"]').value.trim();
    if(ata&&!time.test(ata))throw Error('ATA must be HH:MM UTC');
    let actual_alt=positive(document.querySelector('[data-alt="'+i+'"]').value,'Altitude');
    if(actual_alt&&Number(actual_alt)>60000)throw Error('Altitude exceeds 60000 ft');
    return act('saveWaypoint',{index:i,ident:r.ident,ata,actual_fob:positive(document.querySelector('[data-fob="'+i+'"]').value,'Fuel'),actual_alt});
  }));
  document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.skip);if(confirm('Skip '+row(i).ident+'?'))act('skipWaypoint',{index:i,ident:row(i).ident,skipped:true})});
  document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.restore);act('skipWaypoint',{index:i,ident:row(i).ident,skipped:false})});
  document.querySelectorAll('[data-direct]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.direct);if(confirm('Direct to '+row(i).ident+'? Earlier unpassed fixes will be skipped.'))act('directTo',{index:i,ident:row(i).ident})});
  document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>act('undoDirect',{group:b.dataset.undo}));
  on('reset',()=>{if(confirm('Reset tracked waypoints, flight times and signatures?'))act('resetFlight')});
 }
 if(section==='arrival'){
  on('saveArrival',run(async()=>{
   const times=validateTimes({landing:v('ldg'),on:v('on')});
   const actuals={landing_rate:positive(v('rate').replace(/^-/,''),'Landing rate'),arrival_fob:positive(v('fob'),'Fuel')};
   await act('saveTimes',times);
   await act('saveArrival',actuals);
  }));
  on('saveNotes',()=>act('saveNotes',{metar:v('metar'),runway:v('runway'),notes:v('notes')}));
  on('metarFetch',run(async()=>{const a=await api('getMetar',{icao:f.destination});if(a?.metar){d('metar').value=a.metar;message('METAR loaded. Save notes to keep it.')}else message('No METAR available')}));
 }
 if(section==='close'){
  on('finish',()=>{if(confirm('Close this flight and store its report in NAVDECK?'))act('closeFlight')});
  on('reopen',()=>{if(confirm('Reopen this flight for editing?'))act('reopenFlight')});
  on('print',()=>window.print());
  on('pdf',run(async()=>{const x=await api('downloadReport',{flight_id:f.id});if(x?.saved)message('Signed PDF saved')}));
  if(f.signoff?.signed)return;
  const canvas=d('pad');if(!canvas)return;let ctx=canvas.getContext('2d'),drawing=false;ink=false;
  ctx.strokeStyle='#121212';ctx.lineWidth=2;ctx.lineCap='round';
  const point=x=>{const r=canvas.getBoundingClientRect();return [(x.clientX-r.left)*canvas.width/r.width,(x.clientY-r.top)*canvas.height/r.height]};
  canvas.onpointerdown=x=>{drawing=true;ink=true;canvas.setPointerCapture(x.pointerId);let [a,b]=point(x);ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(a+.1,b+.1);ctx.stroke()};
  canvas.onpointermove=x=>{if(!drawing)return;let [a,b]=point(x);ctx.lineTo(a,b);ctx.stroke()};
  canvas.onpointerup=()=>{drawing=false};
  on('clearPad',()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ink=false});
  on('sign',run(()=>{
    if(v('pilotName').length<2)throw Error('Enter commander name');
    if(!d('agree').checked)throw Error('Confirm the flight record');
    if(!ink)throw Error('Draw your signature');
    return act('signReport',{signed_by:v('pilotName'),remarks:v('remarks')||null,signature:canvas.toDataURL('image/png')});
  }));
 }
}
on('back',()=>location.href='workspace.html#flights');
init();
})();</script></body></html>
