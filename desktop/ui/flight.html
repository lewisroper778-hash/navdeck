</style></head><body><main><header class="top"><div class="crumb">NAVDECK › MY FLIGHTS › <b>FLIGHT OPERATIONS</b></div><span class="status ok"><i></i><span id="cloudMode">Desktop cloud link</span></span></header><div class="toolbar"><button class="button ghost" id="back">← My Flights</button></div><section class="hero"><div><span class="eyebrow">OPERATIONAL FLIGHT DECK</span><h1 id="title">Loading flight…</h1><p id="route">— → —</p><p id="aircraft"></p></div></section><div id="statusMsg" hidden></div><div class="demo-banner" id="demoBanner" hidden><strong>Demonstration flight.</strong> All route, fuel and waypoint figures are illustrative. You can test the reporting and sign-off workflow; no flight is imported or saved to your NAVDECK account.</div><div class="panel" id="summary"></div><nav class="phasebar" id="phasebar"></nav><div id="stage"></div></main><script>
(()=>{
'use strict';
const d=id=>document.getElementById(id);
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const v=id=>d(id)?.value.trim()||'';
const api=(name,arg)=>window.navdeckDesktop?.[name]?.(arg)||Promise.reject(Error('Native bridge unavailable'));
const info=(k,x)=>'<div class="detail"><small>'+e(k)+'</small><b>'+e(x??'—')+'</b></div>';
const details=(items)=>'<div class="details-grid">'+items.map(([k,x])=>info(k,x)).join('')+'</div>';
const panel=(title,body)=>'<section class="panel"><div class="panel-head"><h2>'+e(title)+'</h2></div>'+body+'</section>';
const field=(id,label,value,ph='',type='text')=>'<div class="field"><label for="'+id+'">'+e(label)+'</label><input id="'+id+'" type="'+type+'" value="'+e(value??'')+'" placeholder="'+e(ph)+'"></div>';
const button=(id,title)=>'<button class="button primary" id="'+id+'" data-edit>'+e(title)+'</button>';
const time=/^([01]\d|2[0-3]):[0-5]\d$/;
const phases=['briefing','departure','enroute','arrival','close'];

function clockAdd(base,seconds){
 if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(base||''))return null;
 const [h,m]=base.split(':').map(Number);
 const total=((h*60+m+Math.round(Number(seconds||0)/60))%1440+1440)%1440;
 return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}
function timeDeviation(actual,planned){
 if(!actual||!planned)return null;
 let [a,b]=[actual,planned].map(v=>{const [h,m]=v.split(':').map(Number);return h*60+m});
 let delta=a-b;
 if(delta>720)delta-=1440;
 if(delta< -720)delta+=1440;
 return delta;
}
function navlogRows(flight){
 const base=flight.times?.takeoff||flight.times?.sched_takeoff||null;
 let lastATA=null,lastETASecs=0,lastFuelDeviation=0;
 return (flight.waypoints||[]).map(w=>{
   if(w.skipped)return {...w,eto:null,planned:null,fuelDeviation:null,timeDev:null};
   const sec=Number(w.eta||0);
   const planned=base&&w.eta?clockAdd(base,sec):null;
   const planFuel=(w.fob!==null&&w.fob!==undefined&&w.fob!=='')?Number(w.fob):null;
   const actualFuel=(w.actual_fob!==null&&w.actual_fob!==undefined&&w.actual_fob!=='')?Number(w.actual_fob):null;
   const fuelDeviation=Number.isFinite(actualFuel)&&Number.isFinite(planFuel)?actualFuel-planFuel:null;
   let eto,dev;
   if(w.ata){
     eto=w.ata;dev=timeDeviation(w.ata,planned);
     lastATA=w.ata;lastETASecs=sec;
   }else{
     eto=lastATA?clockAdd(lastATA,sec-lastETASecs):planned;
     dev=lastATA&&planned?timeDeviation(eto,planned):null;
   }
   const estimatedFuel=Number.isFinite(actualFuel)?actualFuel:
     Number.isFinite(planFuel)?planFuel+lastFuelDeviation:null;
   if(fuelDeviation!==null)lastFuelDeviation=fuelDeviation;
   return {...w,planned,eto,timeDev:dev,fuelDeviation,estimatedFuel};
 });
}
function fuelSummary(flight,rows){
 const current=rows.filter(x=>!x.skipped&&x.fuelDeviation!==null);
 const deviation=current.length?current[current.length-1].fuelDeviation:0;
 const fuel=flight.fuel||{};
 const dest=rows.filter(x=>!x.skipped).at(-1);
 const plan=dest?.fob==null||dest.fob===''?null:Number(dest.fob);
 const predicted=plan!==null&&Number.isFinite(plan)?plan+deviation:null;
 const minFuel=fuel.min_fuel!=null&&fuel.min_fuel!==''?Number(fuel.min_fuel):Number(fuel.alternate||0)+Number(fuel.reserve||0);
 const reserve=Number(fuel.mayday_fuel??fuel.reserve??0);
 const burn=Number(fuel.avg_burn_per_hour||0);
 const holdFuel=predicted===null?null:predicted-minFuel;
 const holdMin=holdFuel!==null&&burn>0?Math.max(0,Math.floor(holdFuel/burn*60)):null;
 const state=predicted===null?'NO FORECAST':predicted<reserve?'MAYDAY FUEL':predicted<minFuel?'MINIMUM FUEL':'NORMAL';
 return {deviation,predicted,state,minFuel,reserve,burn,holdFuel,holdMin};
}
function reportBlockers(flight,includeEvents=false){
 const issues=[],waypoints=(flight.waypoints||[]).filter(w=>!w.skipped);
 if(!waypoints.length)issues.push(['Imported waypoint route','enroute']);
 const validNum=x=>x!==null&&x!==undefined&&x!==''&&Number.isFinite(Number(x))&&Number(x)>=0;
 waypoints.forEach(w=>{
   if(!time.test(w.ata||''))issues.push([(w.ident||'Waypoint')+' · Actual UTC time','enroute']);
   if(!validNum(w.actual_fob))issues.push([(w.ident||'Waypoint')+' · Fuel on board','enroute']);
   if(!validNum(w.actual_alt)||Number(w.actual_alt)>60000)issues.push([(w.ident||'Waypoint')+' · Actual altitude','enroute']);
 });
 if(!validNum(flight.arrival_fob))issues.push(['Arrival fuel on board','arrival']);
 if(includeEvents){
   const t=flight.times||{};
   for(const [key,label,phase] of [['off','Gate-out time','departure'],['takeoff','Takeoff time','departure'],['landing','Landing time','arrival'],['on','Gate-in time','arrival']])
     if(!time.test(t[key]||''))issues.push([label,phase]);
   if(!validNum(flight.landing_rate))issues.push(['Landing rate','arrival']);
 }
 return issues;
}
function fuelChart(rows,fuel){
 const data=rows.filter(w=>!w.skipped&&w.fob!==null&&w.fob!==undefined&&w.fob!=='').slice(0,140);
 if(data.length<2)return '<p class="muted">At least two planned waypoints are needed for the fuel trend.</p>';
 const all=data.flatMap(w=>[Number(w.fob),w.actual_fob==null||w.actual_fob===''?null:Number(w.actual_fob)]).filter(x=>x!==null&&Number.isFinite(x));
 if(!all.length)return '';
 const lo=Math.min(...all,fuel.minFuel,fuel.reserve),hi=Math.max(...all);
 const range=Math.max(1,hi-lo),w=920,h=170;
 const x=i=>20+i*(w-40)/Math.max(1,data.length-1);
 const y=value=>h-20-(Number(value)-lo)/range*(h-40);
 const pts=field=>data.map((r,i)=>r[field]==null||r[field]===''?null:[x(i),y(r[field])]).filter(Boolean);
 const poly=points=>points.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
 const plan=pts('fob'),actual=pts('actual_fob');
 const guide=(value,color,label)=>'<line x1="20" y1="'+y(value).toFixed(1)+'" x2="'+(w-20)+'" y2="'+y(value).toFixed(1)+'" stroke="'+color+'" stroke-width="1" stroke-dasharray="6 6"/>'+
 '<text x="'+(w-18)+'" y="'+Math.max(12,y(value)-4).toFixed(1)+'" text-anchor="end" fill="'+color+'" font-size="10">'+label+'</text>';
 return '<div class="fuel-trend"><div class="muted" style="margin-bottom:8px">Planned (blue) vs actual (purple) fuel on board</div>'+
 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 170" role="img" aria-label="Planned versus actual fuel chart">'+
 guide(fuel.minFuel,'#fac879','MIN')+guide(fuel.reserve,'#f39898','RESERVE')+
 '<polyline points="'+poly(plan)+'" stroke="#7cd5ff" fill="none" stroke-width="3" stroke-linejoin="round"/>'+
 (actual.length>1?'<polyline points="'+poly(actual)+'" stroke="#b991ff" fill="none" stroke-width="3" stroke-linejoin="round"/>':'')+
 actual.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.8" fill="#b991ff"/>').join('')+
 '</svg></div>';
}
function signed(v,suffix=''){return v===null||!Number.isFinite(v)?'—':(v>0?'+':'')+Math.round(v)+suffix}

const isDemo=new URL(location.href).searchParams.get('demo')==='1';
let id=new URL(location.href).searchParams.get('id'),f=null,
    section=location.hash==='#enroute'?'enroute':'briefing',
    pending=false,ink=false,latestSample=null,wpPage=0;
function message(text,error=false){let x=d('statusMsg');x.hidden=false;x.className='message '+(error?'err':'good');x.textContent=text}
function clear(){d('statusMsg').hidden=true}
function on(id,fn){if(d(id))d(id).onclick=fn}
function validateTimes(obj){for(const [k,x]of Object.entries(obj)){if(x&&!time.test(x))throw Error(k+' must be HH:MM UTC')}return obj}
function positive(x,name){if(x&&!/^\d+(\.\d+)?$/.test(x))throw Error(name+' must be a positive number');return x||''}
function demoFlight(){
 return {

function demoAction(action,values){
 if(action==='resetFlight'){f=demoFlight();return;}
 if(action==='saveWaypoint'){
   const w=f.waypoints[values.index];if(!w)throw Error('Sample waypoint missing');
   for(const key of ['ata','actual_fob','actual_alt'])
     if(Object.hasOwn(values,key))w[key]=values[key];
   if(w.ata)w.passed=true;
 }else if(action==='toggleWaypoint'){f.waypoints[values.index].passed=!!values.passed;
 }else if(action==='skipWaypoint'){f.waypoints[values.index].skipped=!!values.skipped;
 }else if(action==='directTo'){
   for(let i=0;i<values.index;i++)if(!f.waypoints[i].passed)f.waypoints[i].skipped=true;
 }else if(action==='undoDirect'){f.waypoints.forEach(w=>{w.skipped=false;w.direct_group=null});
 }else if(action==='saveTimes'){Object.assign(f.times,values);
 }else if(action==='saveActuals'){
   for(const key of ['pax_count','cargo','units'])
     if(Object.hasOwn(values,key))f.weights[key]=values[key];
 }else if(action==='saveArrival'){
   Object.assign(f,values);
 }else if(action==='saveNotes'){
   Object.assign(f.arrival_notes,values);
 }else if(action==='signReport'){
   const blockers=reportBlockers(f,true);
   if(blockers.length)throw Error('Complete the required report items before signing');
   f.signoff={...values,signed:true,signed_at:new Date().toISOString()};
 }else if(action==='closeFlight'){
   if(!f.signoff.signed||reportBlockers(f,true).length)throw Error('Complete and sign the report before closing');
   f.status='closed';
 }else if(action==='reopenFlight'){f.status='open';
 }else throw Error('Unsupported sample action: '+action);
}

  }));
  document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.skip);if(confirm('Skip '+row(i).ident+'?'))act('skipWaypoint',{index:i,ident:row(i).ident,skipped:true})});
  document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.restore);act('skipWaypoint',{index:i,ident:row(i).ident,skipped:false})});
  document.querySelectorAll('[data-direct]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.direct);if(confirm('Direct to '+row(i).ident+'? Earlier unpassed fixes will be skipped.'))act('directTo',{index:i,ident:row(i).ident})});
  document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>act('undoDirect',{group:b.dataset.undo}));
  on('reset',()=>{if(confirm('Reset tracked waypoints, flight times and signatures?'))act('resetFlight')});
 }
 if(section==='arrival'){
  on('saveArrival',run(async()=>{
   const times=validateTimes({landing:v('ldg'),on:v('on')});
   const actuals={landing_rate:positive(v('rate').replace(/^-/,''),'Landing rate'),arrival_fob:positive(v('fob'),'Fuel')};
   await act('saveTimes',times);
   await act('saveArrival',actuals);
  }));
  on('saveNotes',()=>act('saveNotes',{metar:v('metar'),runway:v('runway'),notes:v('notes')}));
  on('metarFetch',run(async()=>{const a=await api('getMetar',{icao:f.destination});if(a?.metar){d('metar').value=a.metar;message('METAR loaded. Save notes to keep it.')}else message('No METAR available')}));
 }
 if(section==='close'){
  document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{section=b.dataset.jump;draw();});
  on('finish',()=>{if(confirm('Close this flight and store its report in NAVDECK?'))act('closeFlight')});
  on('reopen',()=>{if(confirm('Reopen this flight for editing?'))act('reopenFlight')});
  on('print',()=>window.print());
  on('pdf',run(async()=>{
    if(isDemo){message('Demonstration reports are not stored in the NAVDECK cloud. Use Print for a sample preview.');return;}
    const x=await api('downloadReport',{flight_id:f.id});if(x?.saved)message('Signed PDF saved')
  }));
  if(f.signoff?.signed)return;
  const canvas=d('pad');if(!canvas)return;let ctx=canvas.getContext('2d'),drawing=false;ink=false;
  ctx.strokeStyle='#121212';ctx.lineWidth=2;ctx.lineCap='round';
  const point=x=>{const r=canvas.getBoundingClientRect();return [(x.clientX-r.left)*canvas.width/r.width,(x.clientY-r.top)*canvas.height/r.height]};
  canvas.onpointerdown=x=>{drawing=true;ink=true;canvas.setPointerCapture(x.pointerId);let [a,b]=point(x);ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(a+.1,b+.1);ctx.stroke()};
  canvas.onpointermove=x=>{if(!drawing)return;let [a,b]=point(x);ctx.lineTo(a,b);ctx.stroke()};
  canvas.onpointerup=()=>{drawing=false};
  on('clearPad',()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ink=false});
  on('sign',run(()=>{
    if(v('pilotName').length<2)throw Error('Enter commander name');
    if(!d('agree').checked)throw Error('Confirm the flight record');
    if(!ink)throw Error('Draw your signature');
    return act('signReport',{signed_by:v('pilotName'),remarks:v('remarks')||null,signature:canvas.toDataURL('image/png')});
  }));
 }
}
on('back',()=>location.href='workspace.html#flights');
window.addEventListener('hashchange',()=>{
 const selected=location.hash.replace('#','');
 if(f&&phases.includes(selected)&&section!==selected){section=selected;draw();}
});
setInterval(()=>{if(!document.hidden)refreshLive();},2400);
init();
})();</script></body></html>
