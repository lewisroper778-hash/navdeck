<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAVDECK Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#map{height:100%;width:100%;margin:0}body{background:#101722;color:#e5edf8;font:14px 'Segoe UI',sans-serif}
#map{background:#111827}.panel{position:absolute;z-index:1000;background:#101827ee;border:1px solid #344258;border-radius:12px;box-shadow:0 8px 30px #0008;padding:14px 18px}
#status{top:24px;left:24px;min-width:300px;backdrop-filter:blur(14px)}
#flight{top:167px;left:24px;min-width:300px;max-width:360px;backdrop-filter:blur(14px)}
.flight-name{font-size:23px;font-weight:750;letter-spacing:.2px;margin:8px 0 3px}
.flight-route{font-size:13px;color:#95b2d5;margin:0 0 13px}
.flight-divider{height:1px;background:#30435c;margin:12px 0}
.flight-sub{display:flex;justify-content:space-between;gap:16px;font-size:12px;margin-top:10px;color:#a6bbd5}
.flight-sub strong{color:#ecf6ff;font-weight:650;text-align:right}
@media(max-width:720px){#status,#flight{left:10px;min-width:230px;padding:10px}#status{top:10px}#flight{top:139px}#metrics{bottom:10px;left:10px;right:10px;gap:12px}#follow{top:10px;right:10px}}.eyebrow{color:#9db0ce;letter-spacing:2px;font-size:11px;font-weight:700;margin-bottom:8px}#connection{font-weight:700}
#metrics{bottom:24px;left:24px;right:24px;display:flex;gap:18px;flex-wrap:wrap;justify-content:space-around;backdrop-filter:blur(14px)}#follow{top:20px;right:20px;cursor:pointer;color:white;font-weight:700}#fitroute{top:75px;right:20px;cursor:pointer;color:#cce5fa;font-weight:700}
.metric{display:flex;flex-direction:column;gap:7px;color:#94a8c5;font-size:10px;font-weight:800;letter-spacing:1.8px}.metric b{color:#eef7ff;font-size:21px;letter-spacing:0;font-weight:700}.leaflet-control-attribution{background:#101827cc!important;color:#abb9cc!important}.leaflet-control-attribution a{color:#91c7e9!important}
.aircraft{width:38px;height:38px;filter:drop-shadow(0 2px 4px #000a)}.aircraft svg{width:38px;height:38px}
</style></head><body>
<div id="map"></div><div id="status" class="panel"><div class="eyebrow">● LIVE OPERATIONS</div><div style="font-size:21px;font-weight:750;margin-bottom:8px">Flight overview</div><div id="connection" style="color:#a8c0db">○ Awaiting simulator telemetry</div><div style="font-size:11px;color:#7085a5;margin-top:9px">REAL-TIME AIRCRAFT POSITION</div></div>
<section id="flight" class="panel" aria-label="Flight details">
  <div class="eyebrow">ACTIVE FLIGHT</div>
  <div class="flight-name" id="callsign">No flight loaded</div>
  <div class="flight-route" id="route">Departure — → Destination —</div>
  <div class="flight-divider"></div>
  <div class="flight-sub"><span>FLIGHT PHASE</span><strong id="phase">Parked</strong></div>
  <div class="flight-sub"><span>FLIGHT PLAN</span><strong id="waypoints">No waypoints synced</strong></div>
  <div class="flight-sub"><span>AIRCRAFT</span><strong id="aircraft-name">Waiting for simulator</strong></div>
</section>
<button id="follow" class="panel" type="button">⌖  Following aircraft</button>
<button id="fitroute" class="panel" type="button" title="View all pending route waypoints">◇  Fit flight plan</button>
<div id="metrics" class="panel"><span class="metric">ALT <b id="alt">—</b> FT</span><span class="metric">GS <b id="gs">—</b> KT</span><span class="metric">HDG <b id="hdg">—</b>°</span><span class="metric">GPS <b id="gps">—</b></span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  const status=document.getElementById('connection');
  if(!window.L){status.textContent='Map library unavailable — check internet connection';return;}
  const map=L.map('map',{zoomControl:true}).setView([51.5,-0.12],5);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri',maxZoom:18}).addTo(map);
  let marker=null,follow=true,busy=false;
  let routeLine=null;
  const track=[];
  let plannedRoute=null, directLine=null, routeSignature='';
  let nextFix=null;
  const routeMarkers=L.layerGroup().addTo(map);
  const fitButton=document.getElementById('fitroute');
  fitButton.onclick=()=>{
    const coords=plannedRoute?.getLatLngs() || [];
    if(!coords.length)return;
    follow=false;
    document.getElementById('follow').textContent='⌖  Follow aircraft';
    const bounds=L.latLngBounds(coords);
    if(marker)bounds.extend(marker.getLatLng());
    map.fitBounds(bounds,{padding:[55,55],maxZoom:11});
  };
  function showFlightPlan(raw){
    const fixes=Array.isArray(raw)?raw.filter(f=>f&&Number.isFinite(f.lat)&&
      Number.isFinite(f.lon)&&Math.abs(f.lat)<=90&&Math.abs(f.lon)<=180).slice(0,300):[];
    const signature=fixes.map(f=>String(f.ident)+':'+f.lat+':'+f.lon).join('|');
    nextFix=fixes[0]||null;
    if(signature===routeSignature)return;
    routeSignature=signature;
    routeMarkers.clearLayers();
    if(plannedRoute){map.removeLayer(plannedRoute);plannedRoute=null;}
    if(directLine){map.removeLayer(directLine);directLine=null;}
    if(!fixes.length)return;
    plannedRoute=L.polyline(fixes.map(f=>[f.lat,f.lon]),{
      color:'#62cbf4',weight:2.5,dashArray:'5 8',opacity:.65
    }).addTo(map);
    fixes.forEach((f,i)=>{
      const tooltip=document.createElement('span');
      tooltip.textContent=String(f.ident||'FIX');
      L.circleMarker([f.lat,f.lon],{radius:i===0?6:4,
        color:i===0?'#f8fafc':'#7dd3fc',fillColor:'#0e344b',
        fillOpacity:1,weight:2}).bindTooltip(tooltip).addTo(routeMarkers);
    });
  }
  const button=document.getElementById('follow');
  button.onclick=()=>{follow=!follow;button.textContent=follow?'⌖  Following aircraft':'⌖  Follow aircraft';};
  const format=(n,d=0)=>Number.isFinite(n)?n.toFixed(d):'—';
  async function update(){
    if(busy)return;
    if(typeof window.navdeckDesktop?.getTelemetry!=='function'){status.textContent='○ Native simulator bridge unavailable';return;}
    busy=true;
    try{
      const t=await window.navdeckDesktop.getTelemetry();
      const display=(id,value,fallback)=>{document.getElementById(id).textContent=
        typeof value==='string' && value.trim()?value:fallback;};
      display('callsign',t?.flight,'No flight loaded');
      display('route',t?.route,'Departure — → Destination —');
      display('phase',t?.stage,'Parked');
      display('waypoints',t?.waypoints,'No waypoints synced');
      display('aircraft-name',t?.aircraft,'Waiting for simulator');
      showFlightPlan(t?.flight_plan);
      if(!t||!Number.isFinite(t.lat)||!Number.isFinite(t.lon)||
          Math.abs(t.lat)>90||Math.abs(t.lon)>180||(t.lat===0&&t.lon===0)){
        status.textContent=t?.sim_connected?'○ Waiting for aircraft GPS':'○ Simulator disconnected';
        status.style.color='#a8c0db';
        if(marker){map.removeLayer(marker);marker=null;}
        for(const id of ['alt','gs','hdg','gps'])document.getElementById(id).textContent='—';
        return;
      }
      status.textContent='● Aircraft tracking live';status.style.color='#68e5bd';
      const heading=Number.isFinite(t.heading_deg)?t.heading_deg:0;
      const icon=L.divIcon({className:'',html:`<div class="aircraft" style="transform:rotate(${heading}deg)"><svg viewBox="0 0 24 24"><path d="M12 2 L15 10 L22 14 L22 17 L13.5 14.5 L13.5 20 L16 22 L16 23 L12 22 L8 23 L8 22 L10.5 20 L10.5 14.5 L2 17 L2 14 L9 10 Z" fill="#38bdf8" stroke="#e0f2fe" stroke-width=".7"/></svg></div>`,iconSize:[38,38],iconAnchor:[19,19]});
      if(!marker){marker=L.marker([t.lat,t.lon],{icon}).addTo(map).bindTooltip('Live simulator aircraft');if(follow)map.setView([t.lat,t.lon],9);}
      else{marker.setLatLng([t.lat,t.lon]);marker.setIcon(icon);if(follow)map.panTo([t.lat,t.lon],{animate:true});}
      if(nextFix){
        const legs=[[t.lat,t.lon],[nextFix.lat,nextFix.lon]];
        if(!directLine)directLine=L.polyline(legs,{
          color:'#facc15',weight:2,opacity:.75,dashArray:'4 6'}).addTo(map);
        else directLine.setLatLngs(legs);
      } else if(directLine) {
        map.removeLayer(directLine);directLine=null;
      }
      const last=track[track.length-1];
      if(last && Math.abs(last[0]-t.lat)+Math.abs(last[1]-t.lon)>2){track.length=0;}
      if(!last || Math.abs(last[0]-t.lat)+Math.abs(last[1]-t.lon)>0.00008){
        track.push([t.lat,t.lon]);
        if(track.length>1200)track.shift();
        if(!routeLine)routeLine=L.polyline(track,{color:'#38bdf8',weight:3,opacity:.7}).addTo(map);
        else routeLine.setLatLngs(track);
      }
      document.getElementById('alt').textContent=format(t.altitude_ft);
      document.getElementById('gs').textContent=format(t.groundspeed_kt);
      document.getElementById('hdg').textContent=format(heading);
      document.getElementById('gps').textContent=format(t.lat,3)+', '+format(t.lon,3);
    }catch{status.textContent='○ Simulator telemetry unavailable';}
    finally{busy=false;}
  }
  update();setInterval(update,1000);
})();
</script></body></html>
