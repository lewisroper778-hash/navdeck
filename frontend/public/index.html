                var done = function () { location.replace("/?fresh=" + Date.now()); };
                var jobs = [];
                try { localStorage.clear(); } catch (e) {}
                if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
                if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
                Promise.all(jobs).then(done, done);
            }
            setTimeout(function () {
                if (window.__navdeckBooted) return;
                document.getElementById("boot-fallback").style.display = "grid";
                try {
                    var scripts = Array.prototype.map.call(document.scripts, function (s) { return s.src; }).filter(Boolean).join(" ");
                    navigator.sendBeacon && navigator.sendBeacon("/api/client-errors", new Blob([JSON.stringify({ message: "App bundle did not boot within 10s", stack: scripts.slice(0, 5000), url: location.href.slice(0, 500), ua: navigator.userAgent.slice(0, 400) })], { type: "application/json" }));
                } catch (e) {}
            }, 10000);
        </script>
